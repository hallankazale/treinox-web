name: TreinoX Preview QA
on:
  push:
    branches: [main]
    paths:
      - 'preview/**'
      - '.github/workflows/preview-qa.yml'
  pull_request:
    paths:
      - 'preview/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validar UX, scripts e GIFs
        run: node preview/test.mjs
