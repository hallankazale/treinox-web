name: Gerar GIFs originais TreinoX
on:
  push:
    branches: [main]
    paths:
      - "preview/scripts/generate_gifs.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Preparar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Preparar Pillow
        run: python -m pip install --disable-pip-version-check Pillow==12.3.0
      - name: Gerar GIFs
        run: python preview/scripts/generate_gifs.py
      - name: Registrar GIFs no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/gifs/
          if git diff --cached --quiet; then
            echo "Sem alterações em GIFs"
            exit 0
          fi
          git commit -m "assets: gera 24 GIFs originais"
          git push origin HEAD:main
